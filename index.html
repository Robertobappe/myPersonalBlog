<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roberto Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 Roberto Blog</h1>

        <form id="postForm">
            <input type="text" id="title" placeholder="Título do post" required>
            <textarea id="content" placeholder="Conteúdo do post..." rows="3" required></textarea>
            <button type="submit">Publicar Agora</button>
        </form>

        <hr>
        <h2>Feed Recente</h2>
        <div id="posts-container">Carregando posts do servidor...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
